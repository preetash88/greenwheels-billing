version: "3.9"

services:
  stub:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: greenwheels-stub
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s